# Meson cross file for building the text stack (glib, pango, cairo, ...) for the PS Vita.
[binaries]
c = 'arm-vita-eabi-gcc'
cpp = 'arm-vita-eabi-g++'
ar = 'arm-vita-eabi-gcc-ar'
strip = 'arm-vita-eabi-strip'
pkg-config = '@DIRNAME@' / 'pkg-config'

[built-in options]
c_args = ['-O2', '-ffunction-sections', '-fdata-sections', '-I/opt/vitasdk/arm-vita-eabi/include', '-include', '@DIRNAME@' / 'compat' / 'vita-compat.h']
cpp_args = ['-O2', '-ffunction-sections', '-fdata-sections', '-I/opt/vitasdk/arm-vita-eabi/include']
c_link_args = ['-L/opt/vitasdk/arm-vita-eabi/lib']
cpp_link_args = ['-L/opt/vitasdk/arm-vita-eabi/lib']
default_library = 'static'
# Not position-independent: the Vita's loader takes absolute relocations only, and vita-elf-create
# rejects the GOT-relative ones -fPIC code needs (R_ARM_BASE_PREL).
b_staticpic = false
prefix = '/opt/vitasdk/arm-vita-eabi'
libdir = 'lib'
buildtype = 'release'
wrap_mode = 'nofallback'

[properties]
pkg_config_libdir = '/opt/vitasdk/arm-vita-eabi/lib/pkgconfig'
# Nothing built for the Vita can run on the build machine.
needs_exe_wrapper = true

[host_machine]
system = 'vita'
cpu_family = 'arm'
cpu = 'cortex-a9'
endian = 'little'
