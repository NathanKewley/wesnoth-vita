<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig setup for the PS Vita, installed as ux0:data/wesnoth/fonts.conf and found through
  FONTCONFIG_FILE (set in wesnoth.cpp). There are no system fonts: only Wesnoth's own.
  Paths are written the way the Vita's C library resolves them from ux0: (see wesnoth.cpp).
-->
<fontconfig>
	<dir>/data/wesnoth/fonts</dir>
	<!-- Scanning the fonts takes a while on the Vita's CPU; after the first start this cache is read instead. -->
	<cachedir>/data/wesnoth/userdata/cache/fontconfig</cachedir>
	<!-- Wesnoth's own rendering settings: no subpixel colour, full hinting, antialiasing. -->
	<include ignore_missing="yes">/data/wesnoth/fonts/fonts.conf</include>
	<config>
		<!-- The fonts never change on their own, so never check them again. -->
		<rescan><int>0</int></rescan>
	</config>
</fontconfig>
